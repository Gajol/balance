<link rel="apple-touch-icon" sizes="180x180" href="{{ 'apple-touch-icon.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ 'favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ 'favicon-16x16.png' | relative_url }}">
<meta name="theme-color" content="#ffffff">

<style>
  /* wider reading area on big monitors; keeps the theme's side contents list */
  body.wide-text .masthead__inner-wrap,
  body.wide-text .initial-content,
  body.wide-text .page__footer { max-width: 1900px; }
</style>

<style>
  /* Tags page */
  body.tags-page .masthead__inner-wrap,
  body.tags-page .initial-content,
  body.tags-page .page__footer { max-width: 1900px; }
  body.tags-page .page { width: 100%; padding-right: 0; float: none; }
  .tag-cloud { display: flex; flex-wrap: wrap; gap: .5em; margin: 1.2em 0 2.2em; }
  .tag-cloud a { display: inline-block; padding: .2em .7em; border: 1px solid #ccc; border-radius: 3px; background: transparent; color: #333; text-decoration: none; font-size: .95em; line-height: 1.4; }
  .tag-cloud a:hover { background: #f2f2f2; border-color: #999; color: #000; }
  .tag-cloud a small { color: #888; margin-left: .4em; font-size: .85em; }
  .tag-group { display: flex; align-items: baseline; gap: 1em; }
  .tag-group .tag-label { flex: 0 0 5.5em; font-size: .8em; text-transform: uppercase; letter-spacing: .06em; color: #888; }
  .tag-group .tag-cloud { margin: .4em 0 .6em; }
  .tag-cloud a.active { background: #333; border-color: #333; color: #fff; }
  .tag-cloud a.active small { color: #ccc; }
  .tag-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.2em; }
  .tag-card { border: 1px solid #e2e2e2; border-radius: 6px; padding: .2em 1.1em 1em; }
  .tag-card h2 { margin: .8em 0 .4em; padding: 0; border: 0; font-size: 1.4em; }
  .tag-card h2 small { font-weight: 400; color: #888; font-size: .65em; }
  .tag-card ul { margin: 0; padding-left: 1.1em; }
  .tag-card li { margin: .25em 0; }
</style>
