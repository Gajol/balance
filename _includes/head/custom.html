<link rel="apple-touch-icon" sizes="180x180" href="{{ 'apple-touch-icon.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ 'favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ 'favicon-16x16.png' | relative_url }}">
<meta name="theme-color" content="#ffffff">

<style>
  /* Book pages keep a left contents list (sidebar), so they keep a 220px gutter.
     All other pages use full-width: no gutter. Both share one 1500px frame. */
  body.wide-text .masthead__inner-wrap,
  body.wide-text .initial-content,
  body.wide-text .page__footer { max-width: 1500px; }
  /* extra-wide: content fills the space beside the sidebar (classes: wide-text wider) */
  @media (min-width: 80em) {
    body.wider .page { width: calc(100% - 220px); padding-right: 0; }
    body.wider .page__content, body.wider .page__inner-wrap { max-width: none; }
  }
</style>

<style>
  /* Tags page */
  body.tags-page .masthead__inner-wrap,
  body.tags-page .initial-content,
  body.tags-page .page__footer { max-width: 1500px; }
  body.tags-page .page { width: 100%; padding-right: 0; float: none; }
  .tag-cloud { display: flex; flex-wrap: wrap; gap: .5em; margin: 1.2em 0 2.2em; }
  .tag-cloud a { display: inline-block; padding: .2em .7em; border: 1px solid #ccc; border-radius: 3px; background: transparent; color: #333; text-decoration: none; font-size: .95em; line-height: 1.4; }
  .tag-cloud a:hover { background: #f2f2f2; border-color: #999; color: #000; }
  .tag-cloud a small { color: #888; margin-left: .4em; font-size: .85em; }
  .tag-group { display: flex; align-items: baseline; gap: 1em; }
  .tag-group .tag-label { flex: 0 0 5.5em; font-size: .8em; text-transform: uppercase; letter-spacing: .06em; color: #888; }
  .tag-group .tag-cloud { margin: .4em 0 .6em; }
  .tag-cloud a.active { background: #333; border-color: #333; color: #fff; }
  .tag-cloud a.active small { color: #ccc; }
  .tag-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.2em; }
  .tag-card { border: 1px solid #e2e2e2; border-radius: 6px; padding: .2em 1.1em 1em; }
  .tag-card h2 { margin: .8em 0 .4em; padding: 0; border: 0; font-size: 1.4em; }
  .tag-card h2 small { font-weight: 400; color: #888; font-size: .65em; }
  .tag-card ul { margin: 0; padding-left: 1.1em; }
  .tag-card li { margin: .25em 0; }
</style>

<style>
  /* Full-width pages without the author sidebar (classes: full-width) */
  body.full-width .masthead__inner-wrap,
  body.full-width .initial-content,
  body.full-width .page__footer { max-width: 1500px; }
  body.full-width .page { width: 100%; padding-right: 0; float: none; }
</style>

<style>
  /* Think Fast reference section: jump links, filter, collapsible groups */
  .ref-jump { display: flex; flex-wrap: wrap; gap: .5em; margin: 1em 0 .6em; }
  .ref-jump a { padding: .2em .7em; border: 1px solid #ccc; border-radius: 3px; color: #333; text-decoration: none; font-size: .9em; }
  .ref-jump a:hover { background: #f2f2f2; border-color: #999; }
  .ref-filter { display: flex; flex-wrap: wrap; align-items: center; gap: .6em; margin: .4em 0 1.2em; position: sticky; top: 0; background: #fff; padding: .5em 0; z-index: 5; }
  .ref-filter label { font-size: .8em; text-transform: uppercase; letter-spacing: .06em; color: #888; }
  .ref-filter input { flex: 1 1 18em; max-width: 30em; padding: .4em .6em; border: 1px solid #bbb; border-radius: 3px; font-size: 1em; }
  .ref-filter #ref-count { color: #595959; font-size: .9em; }
  .ref-filter button { padding: .3em .8em; border: 1px solid #bbb; background: #fff; border-radius: 3px; cursor: pointer; }
  details.ref-group { border: 1px solid #e2e2e2; border-radius: 6px; margin: 0 0 1em; padding: 0 1em .6em; }
  details.ref-group > summary { cursor: pointer; font-weight: 700; font-size: 1.15em; padding: .7em 0; list-style-position: inside; scroll-margin-top: 4em; }
  details.ref-group table { font-size: .9em; width: 100%; }
  details.ref-group td, details.ref-group th { vertical-align: top; }
  .ref-top { position: fixed; right: 1.2em; bottom: 1.2em; padding: .5em .9em; border: 1px solid #999; background: #fff; border-radius: 3px; cursor: pointer; z-index: 10; }
  .ref-top[hidden], .ref-filter button[hidden] { display: none; }
</style>

<style>
  /* Series navigation (Part n of N, previous, next) */
  .series-nav { border: 1px solid #e2e2e2; border-left: 4px solid #666; border-radius: 4px; padding: .6em 1em; margin: 0 0 1.5em; font-size: .9em; background: #fafafa; }
  .series-nav p { margin: .2em 0; }
  .series-nav__links { display: flex; justify-content: space-between; gap: 1em; flex-wrap: wrap; }
  .series-nav__next { margin-left: auto; text-align: right; }
  .last-updated { margin: .8em 0 0; font-size: .85em; color: #595959; }
</style>
