# Builds the site, creates the Pagefind search index, and commits it to pagefind/.
# GitHub Pages then publishes the index with the rest of the site.
name: Build search index
on:
  push:
    branches: [gh-pages]
    paths-ignore: ['pagefind/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pagefind
  cancel-in-progress: true
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build -d _site
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_REPO_NWO: ${{ github.repository }}
      - name: Build index
        run: npx -y pagefind@1.5.2 --site _site --output-path pagefind
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pagefind
          if git diff --cached --quiet; then echo "No index changes"; else
            git commit -m "Update search index [skip ci]"
            git pull --rebase origin gh-pages
            git push origin HEAD:gh-pages
          fi
