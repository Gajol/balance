<svg viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg" role="img"><title>Observability: three lanes</title><desc>Logs and metrics from the site parts go through a local forwarder to the team observability platform inside the secure zone. The platform sends a security stream and a health stream through the approved one-way feed to the security platform and the monitoring platform.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#595959"/></marker></defs><rect width="720" height="520" fill="#ffffff"/><rect x="8" y="34" width="704" height="308" rx="0" fill="none" stroke="#595959" stroke-width="1.2"/><text x="16" y="50" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#595959" text-anchor="start">Secure zone: The site team owns this</text><rect x="504" y="58" width="190" height="60" rx="0" fill="#EBF2FA" stroke="#333333" stroke-width="1.5"/><text x="599.0" y="86.0" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#333333" text-anchor="middle">Health probes</text><text x="599.0" y="104.0" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#595959" text-anchor="middle">separate small host</text><rect x="24" y="150" width="170" height="80" rx="0" fill="#EBF2FA" stroke="#333333" stroke-width="1.5"/><text x="109.0" y="188.0" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#333333" text-anchor="middle">Site parts</text><text x="109.0" y="206.0" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#595959" text-anchor="middle">CMS, search, cache, analytics</text><rect x="244" y="150" width="170" height="80" rx="0" fill="#EBF2FA" stroke="#333333" stroke-width="1.5"/><text x="329.0" y="188.0" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#333333" text-anchor="middle">Local forwarder</text><text x="329.0" y="206.0" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#595959" text-anchor="middle">tags events, buffers on disk</text><rect x="474" y="150" width="230" height="80" rx="0" fill="#26374A" stroke="#333333" stroke-width="1.5"/><text x="589.0" y="188.0" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Team observability platform</text><text x="589.0" y="206.0" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#ffffff" text-anchor="middle">dashboards, alerts, runbooks</text><rect x="660" y="142" width="40" height="16" rx="0" fill="#ffffff" stroke="#333333" stroke-width="1"/><text x="680" y="154" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#333333" text-anchor="middle">NEW</text><rect x="244" y="262" width="170" height="60" rx="0" fill="#EAF7EE" stroke="#333333" stroke-width="1.5"/><text x="329.0" y="290.0" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#333333" text-anchor="middle">Local copy</text><text x="329.0" y="308.0" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#595959" text-anchor="middle">is the record</text><rect x="468" y="262" width="124" height="60" rx="0" fill="#EBF2FA" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="290.0" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#333333" text-anchor="middle">Security stream</text><text x="530.0" y="308.0" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#595959" text-anchor="middle">numbered, sent once</text><rect x="598" y="262" width="110" height="60" rx="0" fill="#EBF2FA" stroke="#333333" stroke-width="1.5"/><text x="653.0" y="290.0" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#333333" text-anchor="middle">Health stream</text><text x="653.0" y="308.0" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#595959" text-anchor="middle">metrics only</text><line x1="194" y1="190" x2="244" y2="190" stroke="#595959" stroke-width="1.5" marker-end="url(#ar)"/><line x1="414" y1="190" x2="474" y2="190" stroke="#595959" stroke-width="1.5" marker-end="url(#ar)"/><line x1="589" y1="118" x2="589" y2="150" stroke="#595959" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ar)"/><line x1="329" y1="230" x2="329" y2="262" stroke="#595959" stroke-width="1.5" marker-end="url(#ar)"/><path d="M540 230 L540 246 L530 246 L530 262" fill="none" stroke="#595959" stroke-width="1.5" marker-end="url(#ar)"/><path d="M640 230 L640 246 L653 246 L653 262" fill="none" stroke="#595959" stroke-width="1.5" marker-end="url(#ar)"/><rect x="202.2" y="169" width="33.6" height="15" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="219" y="180" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#333333" text-anchor="middle">logs</text><rect x="424.0" y="169" width="40.0" height="15" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="444" y="180" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#333333" text-anchor="middle">sends</text><rect x="587.6" y="127" width="84.80000000000001" height="15" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="630" y="138" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#333333" text-anchor="middle">every minute</text><rect x="430" y="372" width="284" height="44" rx="0" fill="#26374A" stroke="#333333" stroke-width="1.5"/><text x="572.0" y="392.0" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Approved one-way feed</text><text x="572.0" y="410.0" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#ffffff" text-anchor="middle">no replies cross</text><line x1="530" y1="322" x2="530" y2="372" stroke="#595959" stroke-width="1.5" marker-end="url(#ar)"/><line x1="653" y1="322" x2="653" y2="372" stroke="#595959" stroke-width="1.5" marker-end="url(#ar)"/><rect x="430" y="450" width="140" height="60" rx="0" fill="#EAF7EE" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="478.0" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#333333" text-anchor="middle">Security platform</text><text x="500.0" y="496.0" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#595959" text-anchor="middle">security operations</text><rect x="582" y="450" width="132" height="60" rx="0" fill="#EAF7EE" stroke="#333333" stroke-width="1.5"/><text x="648.0" y="478.0" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#333333" text-anchor="middle">Monitoring platform</text><text x="648.0" y="496.0" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#595959" text-anchor="middle">network operations</text><line x1="530" y1="416" x2="530" y2="450" stroke="#595959" stroke-width="1.5" marker-end="url(#ar)"/><line x1="653" y1="416" x2="653" y2="450" stroke="#595959" stroke-width="1.5" marker-end="url(#ar)"/><text x="24" y="470" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#333333" text-anchor="start">The platform is not a security platform.</text><text x="24" y="488" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#595959" text-anchor="start">It adds a third, local view for the site team.</text><text x="24" y="506" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#595959" text-anchor="start">Nothing flows back: settings arrive only in a signed release.</text></svg>