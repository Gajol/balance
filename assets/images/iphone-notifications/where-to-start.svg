<linearGradient id="walldark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262626"/><stop offset="1" stop-color="#5c5c5c"/></linearGradient>
<linearGradient id="wallhome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b6b6b"/><stop offset="1" stop-color="#c4c4c4"/></linearGradient>
<clipPath id="scr"><rect x="10" y="10" width="300" height="640" rx="36"/></clipPath>
</defs><g transform="translate(20,20)"><rect width="320" height="660" rx="46" fill="#1a1a1a"/><g clip-path="url(#scr)"><rect x="10" y="10" width="300" height="640" fill="url(#wall)"/><rect x="148" y="64" width="24" height="18" rx="4" fill="#fff"/><path d="M152 64 v-6 a8 8 0 0 1 16 0 v6" fill="none" stroke="#fff" stroke-width="3"/><text x="160" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#fff">Sunday 25 October</text><text x="160" y="186" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#fff">4:45</text><circle cx="52" cy="590" r="24" fill="#000" fill-opacity=".35"/><circle cx="268" cy="590" r="24" fill="#000" fill-opacity=".35"/><rect x="110" y="628" width="100" height="6" rx="3" fill="#fff"/><rect x="44" y="456" width="232" height="66" rx="16" fill="#cfcfcf" fill-opacity=".7"/><rect x="34" y="448" width="252" height="66" rx="16" fill="#dcdcdc" fill-opacity=".85"/><rect x="24" y="440" width="272" height="66" rx="16" fill="#ececec"/><rect x="36" y="454" width="38" height="38" rx="10" fill="#4a4a4a"/><ellipse cx="55" cy="471" rx="12" ry="9" fill="#fff"/><path d="M45 480 l-2 6 l9 -4 z" fill="#fff"/><text x="86" y="467" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#111">Emma</text><text x="284" y="467" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">now</text><text x="86" y="489" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222">Are you free for dinner?</text></g><rect x="110" y="22" width="100" height="28" rx="14" fill="#000"/></g><circle cx="400" cy="493" r="20" fill="#1a1a1a"/><text x="400" y="501" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">1</text><line x1="300" y1="493" x2="378" y2="493" stroke="#1a1a1a" stroke-width="4"/><text x="436" y="488" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1a1a1a">MIDDLE of the screen</text><text x="436" y="518" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#444">Slide up from here</text><text x="436" y="544" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#444">to see your messages.</text><circle cx="400" cy="651" r="20" fill="#b04a45"/><text x="400" y="659" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">2</text><line x1="240" y1="651" x2="378" y2="651" stroke="#b04a45" stroke-width="4"/><text x="436" y="640" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#b04a45">VERY BOTTOM edge</text><text x="436" y="668" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#444">The thin white bar.</text><text x="436" y="694" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#444">Sliding up here opens the phone.</text></svg>