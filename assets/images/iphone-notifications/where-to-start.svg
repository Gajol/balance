<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" role="img" aria-label="iPhone lock screen showing the middle of the screen and the thin bar at the very bottom"><title>iPhone lock screen showing the middle of the screen and the thin bar at the very bottom</title><defs>
